<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的网站</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #212529;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        nav {
            background-color: #343a40;
            overflow: hidden;
        }
        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        nav a:hover {
            background-color: #0056b3;
        }
        .container {
            width: 80%;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h1 {
            color: #343a40;
            margin-bottom: 15px;
        }
        p {
            color: #495057;
            line-height: 1.6;
        }
        .welcome-section {
            text-align: center;
            padding: 50px 0;
            background-color: #e9ecef;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .welcome-section h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .welcome-section p {
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>我的网站</h1>
    </header>
    <nav>
        <a href="#home">首页</a>
        <a href="#about">关于我们</a>
        <a href="#contact">联系我们</a>
    </nav>
    <div class="container">
        <section class="welcome-section">
            <h1>欢迎光临</h1>
            <p>这里是您的主页，您可以在这里找到关于我们的信息和联系我们的方式。</p>
        </section>

</body>
</html>
